<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <label for="ev">Születési év:</label>
    <input type="text" id="ev" onchange="megad()" />

    <script>
      function megad() {
        let ev = document.getElementById("ev").value;

        if (isNaN(ev)) {
          document.getElementById("ev").style.color = "red";
        } else {
          document.getElementById("ev").style.color = "green";
        }
      }
    </script>
  </body>
</html>
