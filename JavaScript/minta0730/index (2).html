<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kő - papír - olló</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Kő - Papír - Olló</h1>
        <h2>Válassz!</h2>
        <div class="options">
            <div onclick="play('rock')" id="bko">
                <img src="img/ko.png" alt="">
            </div>
            <div onclick="play('paper')" id="bpapir">
                <img src="img/papir.png" alt="">
            </div>
            <div onclick="play('scissors')" id="bollo">
                <img src="img/ollo.png" alt="">
            </div>            
        </div>
        <h2>Gép választása</h2>
        <div>
            <img src="" alt="" id="gepvalasztkep">
        </div>
        <div class="result">
            <h2>Eredmény: <span id="result">-</span></h2>
        </div>
        <h3>Te pontod</h3>
        <div id="tePontod">0</div>
        <h3>Gép pontja</h3>
        <div id="gepPont">0</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
